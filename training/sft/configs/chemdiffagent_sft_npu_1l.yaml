wandb:
  enabled: true
  mode: offline
  entity: null
  resume: false

experiment:
  project: chemdiffagent-sft-npu-1l
  output_dir: /data/hd/outputs/chemdiffagent-sft-npu-1l
  run_name: chemdiffagent-sft-npu-1l
  num_node: 1
  checkpoints_total_limit: 3

model:
  pretrained_model: /data/hd/models/SDAR-1L
  optimized_name: optimized
  reduction:
    # Set this AFTER importing the public, SDAR-compatible safetensors checkpoint.
    source_model: null
    # Retain the first N decoder blocks (N=1 means model.layers.0), plus embed/norm/head.
    num_hidden_layers: 1

dataset:
  validation_fraction: 0.1
  split_seed: 10086
  validation_seed: 10087
  path: /data/hd/dataset/ChemDiffAgent/training/train.json

validation:
  # null means evaluate only at epoch end; integers count optimizer updates.
  eval_steps: null
  eval_after_epoch: true

training:
  device: npu
  gradient_checkpointing_enable: true
  gradient_accumulation_steps: 16
  batch_size_lm: 1
  mixed_precision: bf16
  enable_tf32: false
  seed: 10086
  num_train_epochs: 3
  max_grad_norm: 1.0
  method: semi-ar
  mask_tool_responses: true
  lower_p: 0.1
  upper_p: 0.9
  block_size: 128
  shrink: 1
  post_num: 0
  # Hard limit on the actual padded model input: P + R + noisy_R.
  max_seq_length: 8192
  max_prompt_len: 4096
  max_gen_length: 8192

optimizer:
  name: adamw
  params:
    learning_rate: 1.0e-5
    scale_lr: false
    beta1: 0.9
    beta2: 0.999
    weight_decay: 0.0
    epsilon: 1.0e-8

lr_scheduler:
  scheduler: cosine
  params:
    learning_rate: ${optimizer.params.learning_rate}
    warmup_steps: 0
    min_lr_scale: 1.0

runtime:
  # Use runtime.action=export to prepare weights, then runtime.action=train.
  action: train
  python: /data/workspace/zyc/ChemDiffAgent/envs/sft/bin/python
  cann_root: /data/workspace/zyc/CANN/cann-9.3.0
  work_dir: /data/hd/ChemDiffAgent-work
  num_processes: 1
  # null respects ASCEND_RT_VISIBLE_DEVICES; set an ID or comma-separated IDs to pin.
  visible_devices: null
  main_process_port: 29527
