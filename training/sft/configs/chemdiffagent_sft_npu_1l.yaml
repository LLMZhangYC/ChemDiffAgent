wandb:
  enabled: true
  mode: offline
  entity: null
  resume: false

experiment:
  project: chemdiffagent-sft-npu-1l
  # Resolve against the directory where the launch command is invoked.
  output_dir: .
  run_name: chemdiffagent-sft-npu-1l
  num_node: 1
  checkpoints_total_limit: 3

model:
  pretrained_model: /data/ChemDiffAgent/SDAR-1L
  optimized_name: optimized
  reduction:
    # Export the retained layers from the local SDAR-compatible checkpoint.
    source_model: /data/ChemDiffAgent/SDAR-8B-Chat
    # Retain the first N decoder blocks (N=1 means model.layers.0), plus embed/norm/head.
    num_hidden_layers: 1

dataset:
  path: /data/ChemDiffAgent/dataset/training/train.json
  max_samples: 16

training:
  device: npu
  gradient_checkpointing_enable: true
  gradient_accumulation_steps: 1
  batch_size_lm: 1
  mixed_precision: bf16
  enable_tf32: false
  seed: 10086
  num_train_epochs: 1
  # Stop after three actual optimizer updates, then save a checkpoint.
  max_steps: 3
  max_grad_norm: 1.0
  method: semi-ar
  mask_tool_responses: true
  lower_p: 0.1
  upper_p: 0.9
  block_size: 128
  shrink: 1
  post_num: 0
  # Hard limit on the actual padded model input: P + R + noisy_R.
  # Conservative starting point for a single 64 GB NPU without verified fused attention.
  max_seq_length: 4096
  max_prompt_len: 3072
  max_gen_length: 2048

optimizer:
  name: adamw
  params:
    learning_rate: 1.0e-5
    scale_lr: false
    beta1: 0.9
    beta2: 0.999
    weight_decay: 0.0
    epsilon: 1.0e-8

lr_scheduler:
  scheduler: cosine
  params:
    learning_rate: ${optimizer.params.learning_rate}
    warmup_steps: 0
    min_lr_scale: 1.0

profiling:
  enabled: true
  output_dir: ./prof
  # Schedule units are actual optimizer updates. Reset each epoch.
  skip_first: 0
  wait: 0
  warmup: 1
  active: 2
  repeat: 1
  record_shapes: false
  profile_memory: false
  with_stack: false

runtime:
  # Use runtime.action=export to prepare weights, then runtime.action=train.
  action: train
  python: /data/workspace/zyc/ChemDiffAgent/envs/sft/bin/python
  cann_root: /data/workspace/zyc/CANN/cann-9.3.0
  work_dir: /data/ChemDiffAgent/work/sft-npu-1l
  num_processes: 1
  # null respects ASCEND_RT_VISIBLE_DEVICES; set an ID or comma-separated IDs to pin.
  visible_devices: null
  main_process_port: 29527
